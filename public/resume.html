document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

theme-label: var(--theme-font-weight-normal) var(--theme-ms-0)/var(--theme-line-height-sm) var(--theme-font-sans);\n  --theme-label-sm: var(--theme-font-weight-normal) var(--theme-ms--1)/var(--theme-line-height-sm) var(--theme-font-sans);\n  --theme-label-xs: var(--theme-font-weight-normal) var(--theme-ms--2)/var(--theme-line-height-sm) var(--theme-font-sans);\n\n  /* Code */\n  --theme-code-lg: var(--theme-font-weight-normal) var(--theme-ms-1)/var(--theme-line-height-lg) var(--theme-font-code);\n  --theme-code: var(--theme-font-weight-normal) var(--theme-ms-0)/var(--theme-line-height-lg) var(--theme-font-code);\n  --theme-code-sm: var(--theme-font-weight-normal) var(--theme-ms--1)/var(--theme-line-height-lg) var(--theme-font-code);\n}\n\n/* Siemens iX — Spacing, sizing, radius & motion tokens\n *\n * iX uses TWO spacing ramps:\n *   --theme-space-*   fine-grained interaction spacing (negatives go below the 0.375rem base)\n *   --theme-size-*    layout sizing ramp (1rem … 16rem) for blocks, gaps, containers\n * Plus control heights, icon sizes, border widths, radii and motion durations.\n */\n\n:root {\n  /* Spacing ramp (interaction) */\n  --theme-space--3: 0.125rem;\n  --theme-space--2: 0.1875rem;\n  --theme-space--1: 0.25rem;\n  --theme-space-0: 0.375rem;\n  --theme-space-1: 0.5rem;\n  --theme-space-2: 0.75rem;\n  --theme-space-3: 1rem;\n  --theme-space-4: 1.5rem;\n  --theme-space-5: 2rem;\n  --theme-space-6: 3rem;\n  --theme-space-7: 4rem;\n  --theme-space-8: 6rem;\n\n  /* Sizing ramp (layout) */\n  --theme-size--6: 0.125rem;\n  --theme-size--5: 0.1875rem;\n  --theme-size--4: 0.25rem;\n  --theme-size--3: 0.375rem;\n  --theme-size--2: 0.5rem;\n  --theme-size--1: 0.75rem;\n  --theme-size-0: 1rem;\n  --theme-size-1: 1.5rem;\n  --theme-size-2: 2rem;\n  --theme-size-3: 3rem;\n  --theme-size-4: 4rem;\n  --theme-size-5: 6rem;\n  --theme-size-6: 8rem;\n  --theme-size-7: 12rem;\n  --theme-size-8: 16rem;\n\n  /* Container widths */\n  --theme-container-size-0: 15rem;\n  --theme-container-size-1: 20rem;\n  --theme-container-size-2: 22.5rem;\n  --theme-container-size-3: 30rem;\n  --theme-container-size-4: 37.5rem;\n  --theme-container-size-5: 45rem;\n  --theme-container-size-6: 52.5rem;\n\n  /* Control heights — 24 (compact) / 32 (default) / 40 (large) */\n  --theme-medium-control-height: 24px;\n  --theme-default-control-height: 32px;\n  --theme-large-control-height: 40px;\n\n  /* Icon sizes — 16 / 24 / 32 */\n  --theme-small-icon-size: 1rem;\n  --theme-default-icon-size: 1.5rem;\n  --theme-large-icon-size: 2rem;\n\n  /* Border radius — iX is intentionally low-radius (2–4px) */\n  --theme-min-border-radius: 0rem;\n  --theme-small-border-radius: 0.125rem; /* 2px — buttons, chips */\n  --theme-default-border-radius: 0.25rem; /* 4px — cards, inputs, menus */\n\n  /* Border widths */\n  --theme-border-width-none: 0rem;\n  --theme-border-width-default: 0.0625rem; /* 1px */\n  --theme-border-width-thick: 0.125rem; /* 2px */\n\n  /* Focus ring */\n  --theme-focus-border-thickness: 0.0625rem;\n  --theme-focus-outline-offset: 0.125rem;\n\n  /* Input padding */\n  --theme-input-padding-x: 0.5rem;\n  --theme-input-padding-y: 0.5rem;\n\n  /* Motion durations */\n  --theme-short-time: 0ms; /* @kind other */\n  --theme-default-time: 150ms; /* @kind other */\n  --theme-medium-time: 300ms; /* @kind other */\n  --theme-slow-time: 500ms; /* @kind other */\n  --theme-x-slow-time: 1000ms; /* @kind other */\n}\n\n/* Siemens iX — Effects: shadows & composite borders\n *\n * iX shadows are crisp and functional (multi-layer, low blur) — they scale UP in\n * elevation 1 → 4. Dark theme uses heavier, near-black shadows.\n * Composite border tokens bundle width + style + color for one-line application,\n * e.g. `border: var(--theme-std-bdr-1)`.\n */\n\n:root,\n[data-theme='light'],\n.ix-theme-light {\n  --theme-shadow-1: 0 2px 2px 0 rgba(0, 0, 0, 0.2), 0 1px 1px 0 rgba(0, 0, 0, 0.1);\n  --theme-shadow-2: -4px 0 8px 0 rgba(0, 0, 0, 0.2), 4px 0 8px 0 rgba(0, 0, 0, 0.2), 0 0 16px 0 rgba(0, 0, 0, 0.1);\n  --theme-shadow-3: 0 2px 6px 0 rgba(0, 0, 0, 0.2), 0 0 8px 0 rgba(0, 0, 0, 0.1);\n  --theme-shadow-4: 0 0 2px 0 rgba(0, 0, 0, 0.2), 0 4px 8px 0 rgba(0, 0, 0, 0.1), 0 12px 18px 0 rgba(0, 0, 0, 0.1);\n  --theme-inset-shadow-1: inset 0 2px 4px 0 rgba(0, 0, 0, 0.1);\n}\n\n[data-theme='dark'],\n.ix-theme-dark {\n  --theme-shadow-1: 0 2px 2px 0 #000000, 0 1px 1px 0 rgba(0, 0, 0, 0.6);\n  --theme-shadow-2: -4px 0 8px 0 #000000, 4px 0 8px 0 #000000, 0 0 16px 0 rgba(0, 0, 0, 0.6);\n  --theme-shadow-3: 0 2px 6px 0 #000000, 0 0 8px 0 rgba(0, 0, 0, 0.6);\n  --theme-shadow-4: 0 0 2px 0 #000000, 0 4px 8px 0 rgba(0, 0, 0, 0.6), 0 12px 18px 0 rgba(0, 0, 0, 0.6);\n  --theme-inset-shadow-1: inset 0 2px 4px 0 rgba(0, 0, 0, 0.6);\n}\n\n:root {\n  /* Composite borders — 1 = 1px, 2 = 2px */\n  --theme-std-bdr-1: 0.0625rem solid var(--theme-color-std-bdr);\n  --theme-std-bdr-2: 0.125rem solid var(--theme-color-std-bdr);\n  --theme-soft-bdr-1: 0.0625rem solid var(--theme-color-soft-bdr);\n  --theme-soft-bdr-2: 0.125rem solid var(--theme-color-soft-bdr);\n  --theme-soft-dashed-bdr-1: 0.0625rem dashed var(--theme-color-soft-bdr);\n  --theme-weak-bdr-1: 0.0625rem solid var(--theme-color-weak-bdr);\n  --theme-x-weak-bdr-1: 0.0625rem solid var(--theme-color-x-weak-bdr);\n  --theme-contrast-bdr-1: 0.0625rem solid var(--theme-color-contrast-bdr);\n  --theme-primary-bdr-1: 0.0625rem solid var(--theme-color-primary);\n  --theme-primary-bdr-2: 0.125rem solid var(--theme-color-primary);\n  --theme-alarm-bdr-1: 0.0625rem solid var(--theme-color-alarm);\n  --theme-warning-bdr-1: 0.0625rem solid var(--theme-color-warning);\n  --theme-success-bdr-1: 0.0625rem solid var(--theme-color-success);\n  --theme-info-bdr-1: 0.0625rem solid var(--theme-color-info);\n  --theme-neutral-bdr-1: 0.0625rem solid var(--theme-color-neutral);\n}\n\n/* Siemens iX — Base: light reset, document defaults, typography & icon utilities */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n}\n\nbody {\n  margin: 0;\n  font: var(--theme-body);\n  font-family: var(--theme-font-sans);\n  color: var(--theme-color-std-text);\n  background-color: var(--theme-color-2);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  letter-spacing: var(--theme-letter-spacing-xl);\n}\n\na {\n  color: var(--theme-color-primary);\n  text-decoration: none;\n}\na:hover {\n  text-decoration: underline;\n}\n\ncode,\npre,\nkbd {\n  font-family: var(--theme-font-code);\n}\n\n::selection {\n  background: var(--theme-color-dynamic-alt);\n  color: #000;\n}\n\n/* ---- Typography utilities (font: shorthand from tokens) ---- */\n.typography-display-xxl { font: var(--theme-display-xxl); letter-spacing: var(--theme-letter-spacing-sm); }\n.typography-display-xl  { font: var(--theme-display-xl);  letter-spacing: var(--theme-letter-spacing-sm); }\n.typography-display-lg  { font: var(--theme-display-lg);  letter-spacing: var(--theme-letter-spacing-md); }\n.typography-display     { font: var(--theme-display);     letter-spacing: var(--theme-letter-spacing-md); }\n.typography-display-sm  { font: var(--theme-display-sm);  letter-spacing: var(--theme-letter-spacing-lg); }\n.typography-display-xs  { font: var(--theme-display-xs);  letter-spacing: var(--theme-letter-spacing-sm); }\n\nh1, .typography-h1 { font: var(--theme-h1); letter-spacing: var(--theme-letter-spacing-md); margin: 0; }\nh2, .typography-h2 { font: var(--theme-h2); letter-spacing: var(--theme-letter-spacing-md); margin: 0; }\nh3, .typography-h3 { font: var(--theme-h3); letter-spacing: var(--theme-letter-spacing-lg); margin: 0; }\nh4, .typography-h4 { font: var(--theme-h4); letter-spacing: var(--theme-letter-spacing-lg); margin: 0; }\nh5, .typography-h5 { font: var(--theme-h5); margin: 0; }\nh6, .typography-h6 { font: var(--theme-h6); margin: 0; }\n\n.typography-body-lg { font: var(--theme-body-lg); letter-spacing: var(--theme-letter-spacing-lg); }\n.typography-body    { font: var(--theme-body); }\n.typography-body-sm { font: var(--theme-body-sm); }\n.typography-body-xs { font: var(--theme-body-xs); letter-spacing: var(--theme-letter-spacing-xxl); }\n\n.typography-label-lg { font: var(--theme-label-lg); letter-spacing: var(--theme-letter-spacing-lg); }\n.typography-label    { font: var(--theme-label); }\n.typography-label-sm { font: var(--theme-label-sm); }\n.typography-label-xs { font: var(--theme-label-xs); letter-spacing: var(--theme-letter-spacing-xxl); }\n\n.typography-code    { font: var(--theme-code); }\n.typography-code-lg { font: var(--theme-code-lg); }\n.typography-code-sm { font: var(--theme-code-sm); }\n\n.typography-weight-bold { font-weight: var(--theme-font-weight-bold); }\n\n/* ---- Text color helpers ---- */\n.text-std  { color: var(--theme-color-std-text); }\n.text-soft { color: var(--theme-color-soft-text); }\n.text-weak { color: var(--theme-color-weak-text); }\n.text-primary { color: var(--theme-color-primary); }\n.text-alarm   { color: var(--theme-color-alarm-text); }\n.text-warning { color: var(--theme-color-warning-text); }\n.text-success { color: var(--theme-color-success); }\n\n/* ---- Icon utility ----\n * iX icons are monochrome SVGs. We render them as a mask so they inherit currentColor\n * and theme cleanly. Set --ix-icon to url('assets/icons/<name>.svg').\n * Usage: <span class=\"ix-icon\" style=\"--ix-icon:url(assets/icons/home.svg)\"><\u002Fspan>\n */\n.ix-icon {\n  display: inline-block;\n  width: var(--theme-default-icon-size);\n  height: var(--theme-default-icon-size);\n  flex: 0 0 auto;\n  background-color: currentColor;\n  -webkit-mask: var(--ix-icon) no-repeat center / contain;\n  mask: var(--ix-icon) no-repeat center / contain;\n}\n.ix-icon-16 { width: 1rem; height: 1rem; }\n.ix-icon-24 { width: 1.5rem; height: 1.5rem; }\n.ix-icon-32 { width: 2rem; height: 2rem; }\n\n/* Shared keyframes for loading spinners / progress */\n@keyframes ix-spin {\n  to { transform: rotate(360deg); }\n}\n@keyframes ix-indeterminate {\n  0% { left: -40%; }\n  100% { left: 100%; }\n}\n\n<\u002Fstyle>\n<style>\ndoc-page:not(:defined){visibility:hidden}\na{color:var(--theme-color-primary);text-decoration:none}\na:hover{color:var(--theme-color-primary--active);text-decoration:underline}\n.ent{break-inside:avoid;orphans:3;widows:3}\n<\u002Fstyle>\n<script src=\"9ab25b21-bffe-4b7e-9b9e-e4298e4ffce3\"><\u002Fscript>\n\n<script src=\"d30d50a8-01ce-40a0-9d4a-3ebf7f33c459\"><\u002Fscript>\n<script src=\"73a30824-4e30-4552-bf09-87fcf8cfe4a6\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"a4\" margin=\"0.7in\">\n<header style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:2px solid var(--theme-color-primary);padding-bottom:10px;margin-bottom:18px\">\n<div style=\"display:flex;align-items:flex-end;gap:16px\">\n<image-slot id=\"cv-portrait\" shape=\"{{ portraitShape }}\" radius=\"{{ portraitRadius }}\" style=\"width:{{ portraitW }}px;height:{{ portraitH }}px;flex:none\" placeholder=\"Photo\" src=\"bf8001a5-a71b-4bcc-9dd2-343d13f28f0a\"><\u002Fimage-slot>\n<div>\n<h1 style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:-0.4px;line-height:1.1;margin:0;color:var(--theme-color-std-text)\">Miguel Pereira<\u002Fh1>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13.5px;color:var(--theme-color-primary);font-weight:600;margin-top:4px\">Security Engineer · PSIRT · CNA operations<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-soft-text);line-height:1.5\">\n<a href=\"https://github.com/miguelpereira25\">github.com/miguelpereira25<\u002Fa>\n<a href=\"https://www.linkedin.com/in/miguelpereira25/\">linkedin.com/in/miguelpereira25<\u002Fa>\n<span style=\"color:var(--theme-color-weak-text)\">Portugal · Category B licence<\u002Fspan>\n<\u002Fdiv>\n<\u002Fheader>\n\n<p style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12.5px;line-height:1.6;color:var(--theme-color-std-text);margin:0 0 20px 0;text-wrap:pretty\">I am part of the Siemens ProductCERT / PSIRT team, working where vulnerability research meets product engineering: CNA and coordinated-disclosure operations for industrial and enterprise products, and the internal tooling our analysts rely on day to day. I came into security from development, so I tend to help fix the process as well as the finding. Good disclosure is never a solo effort — most of my work is coordination between researchers, product teams and partners. Alongside this I contribute to the team's conference monitoring service, co-lead OWASP Leiria, and research decentralised vulnerability reference databases for my MSc.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;margin:0 0 20px 0;padding:10px 0;border-top:1px solid var(--theme-color-primary--disabled);border-bottom:1px solid var(--theme-color-primary--disabled);break-inside:avoid\">\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--theme-color-primary);padding-top:1px\">How I work<\u002Fdiv>\n<p style=\"margin:0;font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;line-height:1.6;color:var(--theme-color-std-text);text-wrap:pretty\">What I enjoy most is untangling a problem and leaving the process better than I found it — turning repetitive handling steps into tooling, and making the way a team works together measurably more efficient. That instinct is pulling me towards security management: I want to keep the technical judgement, and use it to shape how a team plans, prioritises and grows.<\u002Fp>\n<\u002Fdiv>\n\n<h2 style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--theme-color-primary);margin:0 0 10px 0;padding-bottom:5px;border-bottom:1px solid var(--theme-color-primary--disabled)\">Experience<\u002Fh2>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;margin-bottom:16px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">2022 — present<\u002Fdiv>\n<div>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13.5px;font-weight:700;color:var(--theme-color-std-text)\">Security Engineer<\u002Fdiv>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;color:var(--theme-color-soft-text);margin-bottom:6px\">Siemens ProductCERT / PSIRT<\u002Fdiv>\n<ul style=\"margin:0;padding-left:16px;font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;line-height:1.55;color:var(--theme-color-std-text)\">\n<li style=\"margin-bottom:3px\">Part of the team handling CNA operations and coordinated vulnerability disclosure for industrial (OT/ICS) and enterprise products — CVE assignment, advisory work, and multi-party coordination with reporters, product teams and partners.<\u002Fli>\n<li style=\"margin-bottom:3px\">Joined as a developer on the team's internal vulnerability-handling platform and still contribute the tooling and automation behind our intake and triage workflow.<\u002Fli>\n<li style=\"margin-bottom:3px\">Contribute to the conference monitoring service: <strong>22 security conferences covered<\u002Fstrong> and <strong>100+ stakeholders<\u002Fstrong> in relationship across companies, research groups and communities, feeding research and trends back to the team.<\u002Fli>\n<li>Vulnerability monitoring across third-party and open-source components, supporting product risk decisions with the product teams.<\u002Fli>\n<\u002Ful>\n<div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-top:8px\">\n<span style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:10px;padding:2px 7px;border-radius:2px;background:var(--theme-color-2);color:var(--theme-color-soft-text)\">CVD<\u002Fspan>\n<span style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:10px;padding:2px 7px;border-radius:2px;background:var(--theme-color-2);color:var(--theme-color-soft-text)\">CNA<\u002Fspan>\n<span style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:10px;padding:2px 7px;border-radius:2px;background:var(--theme-color-2);color:var(--theme-color-soft-text)\">OT / ICS<\u002Fspan>\n<span style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:10px;padding:2px 7px;border-radius:2px;background:var(--theme-color-2);color:var(--theme-color-soft-text)\">PSIRT<\u002Fspan>\n<span style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:10px;padding:2px 7px;border-radius:2px;background:var(--theme-color-2);color:var(--theme-color-soft-text)\">Tooling<\u002Fspan>\n<span style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:10px;padding:2px 7px;border-radius:2px;background:var(--theme-color-2);color:var(--theme-color-soft-text)\">Conference monitoring<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;margin-bottom:16px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">08 — 12/2021<div style=\"color:var(--theme-color-weak-text)\">internship<\u002Fdiv><\u002Fdiv>\n<div>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13.5px;font-weight:700;color:var(--theme-color-std-text)\">Cyber Security R&amp;D Intern<\u002Fdiv>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;color:var(--theme-color-soft-text);margin-bottom:6px\">Dognaedis (Cipher) · Coimbra<\u002Fdiv>\n<p style=\"margin:0;font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;line-height:1.55;color:var(--theme-color-std-text)\">Built a Django platform with user authentication, Celery async task processing, AI image analysis for phishing detection, and a DNS lookup pipeline.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;margin-bottom:16px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">2013 — 2022<\u002Fdiv>\n<div>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13.5px;font-weight:700;color:var(--theme-color-std-text)\">Hospitality &amp; production roles<\u002Fdiv>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;color:var(--theme-color-soft-text);margin-bottom:6px\">Worked through my degree, mostly part-time and alongside study<\u002Fdiv>\n<p style=\"margin:0;font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11.5px;line-height:1.55;color:var(--theme-color-soft-text)\">Bartender &amp; waiter — Grande Hotel de Luso, Curia Palace Hotel Golf &amp; Spa, Caterfesta, Rodoviária pub &amp; bar. Warehouse, expedition and production — Caves da Montanha, Anadia. High-pressure customer-facing work that taught me to stay calm and communicate clearly under load.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--theme-color-primary);margin:22px 0 10px 0;padding-bottom:5px;border-bottom:1px solid var(--theme-color-primary--disabled)\">Education<\u002Fh2>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;margin-bottom:12px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">2025 — present<\ std-text)\">Degree Student Nucleus: President of the Fiscal Council (2020–21), Vice-President (2019–20), Director of Events (2018–19); Vogal, Computer Science Students Nucleus (2017–18); member of the CS &amp; Engineering department, Academic Association of Guarda (2018–19).<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;margin-bottom:12px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">2021 — present<\u002Fdiv>\n<div>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--theme-color-std-text)\">Volunteer — Wildfire Watch<\u002Fdiv>\n<p style=\"margin:3px 0 0 0;font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11.5px;line-height:1.55;color:var(--theme-color-std-text)\">Associação de Voluntários de Ferreiros — summer wildfire surveillance shifts.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">2019<\u002Fdiv>\n<div>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--theme-color-std-text)\">Firefighter Robot Contest 2019<\u002Fdiv>\n<p style=\"margin:3px 0 0 0;font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11.5px;line-height:1.55;color:var(--theme-color-std-text)\">Autonomous robot build and competition entry, Polytechnic Institute of Guarda.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--theme-color-primary);margin:22px 0 10px 0;padding-bottom:5px;border-bottom:1px solid var(--theme-color-primary--disabled)\">Publications<\u002Fh2>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;margin-bottom:12px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">07/2026<\u002Fdiv>\n<div>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--theme-color-std-text)\"><a href=\"https://unit42.paloaltonetworks.com/siemens-rox-ii-zero-day-vulnerabilities/\">Three Steps to the Terminal: A Siemens ROX II Zero-Day Trilogy<\u002Fa><\u002Fdiv>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;color:var(--theme-color-soft-text)\">Unit 42, Palo Alto Networks · co-author with E. Zhou, A. Robbie, R. Wyble<\u002Fdiv>\n<p style=\"margin:3px 0 0 0;font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:11.5px;line-height:1.55;color:var(--theme-color-std-text)\">Joint Siemens ProductCERT / Unit 42 OT Threat Research analysis of three chained zero-days in Ruggedcom ROX II switches (CVE-2025-40947/40948/40949), covering the exploit chain and the coordinated disclosure behind advisories SSA-078743, SSA-081142 and SSA-973901.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"ent\" style=\"display:grid;grid-template-columns:96px 1fr;gap:16px\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--theme-color-neutral);line-height:1.6;padding-top:2px\">08/2026<\u002Fdiv>\n<div>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--theme-color-std-text)\"><a href=\"https://blog.siemens.com/2026/08/siemens-sets-standards-how-data-transforms-cybersecurity/\">Siemens sets standards: how data transforms cybersecurity<\u002Fa><\u002Fdiv>\n<div style=\"font-family:'Siemens Sans','Hanken Grotesk',sans-serif;font-size:12px;color:var(--theme-color-soft-text)\">Siemens Blog · contributor<\u002Fdiv>\n<p style=\"ma
